name: book-gate
# Verificação obrigatória antes do merge na branch oficial.
# Publica o status `book-factory/approval-gate` (exigido pela proteção da branch).
#
# Segurança: roda no contexto da branch BASE (pull_request_target) e usa o
# script de verificação da branch base. O conteúdo do PR é lido apenas como
# DADO — nenhum código do PR é executado.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: book-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Script de verificação da branch base (confiável)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
          path: base
      - name: Conteúdo do PR (somente leitura, como dado)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false
          path: pr
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Executar portão
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          BOOK_FACTORY_OWNERS: ${{ vars.BOOK_FACTORY_OWNERS }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" > /tmp/pr.json
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files?per_page=100" --jq '.[].filename' > /tmp/changed.txt
          set +e
          python base/.github/scripts/book_gate.py gate --repo-root pr --pr-json /tmp/pr.json \
            --changed-files /tmp/changed.txt --summary "$GITHUB_STEP_SUMMARY" > /tmp/gate.json
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/gate.json
      - name: Publicar status obrigatório
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          CODE: ${{ steps.gate.outputs.code }}
        run: |
          if [ "$CODE" = "0" ]; then state=success; desc="Aprovação humana válida; conteúdo idêntico ao aprovado"
          else state=failure; desc="Bloqueado: aguardando aprovação válida ou conteúdo alterado"; fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state="$state" -f context="book-factory/approval-gate" \
            -f description="$desc" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          [ "$state" = success ]
